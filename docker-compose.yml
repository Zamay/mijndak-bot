version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mijndak-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-mijndak}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mijndak-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  bot:
    build:
      context: ./bot
    container_name: mijndak-bot
    restart: unless-stopped
    depends_on:
      - db
      - redis
    env_file:
      - .env

  dashboard:
    build:
      context: ./dashboard
    container_name: mijndak-dashboard
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "3000:3000"
    env_file:
      - .env

volumes:
  pgdata:
  redisdata:
