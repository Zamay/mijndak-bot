name: CI Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-dashboard:
    name: Build Next.js Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dashboard Dependencies
        run: npm ci
        working-directory: ./dashboard

      - name: Build Dashboard
        run: npm run build
        working-directory: ./dashboard

  build-bot:
    name: Build Scraper Bot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bot/package-lock.json

      - name: Install Bot Dependencies
        run: npm ci
        working-directory: ./bot

      - name: Compile Bot
        run: npx tsc --noEmit
        working-directory: ./bot
